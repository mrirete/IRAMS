apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.secretName }}
  labels:
    release: {{ .Release.Name }}
type: Opaque
stringData:
  # In a production environment, use a real secret management system (Vault, AWS Secrets Manager)
  # This is for local/testing Helm deployments
  database_url: "postgresql+asyncpg://ers_admin:ers_password@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.db }}"

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.neo4j.secretName }}
  labels:
    release: {{ .Release.Name }}
type: Opaque
stringData:
  neo4j_uri: "bolt://{{ .Values.neo4j.host }}:{{ .Values.neo4j.port }}"
