{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    app: {{ $name }}
    release: {{ $.Release.Name }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ $name }}
      release: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        release: {{ $.Release.Name }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ $.Release.Name }}-config
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.postgres.secretName }}
                  key: database_url
                  optional: true
            - name: NEO4J_URI
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.neo4j.secretName }}
                  key: neo4j_uri
                  optional: true
          resources:
            {{- toYaml ($svc.resources | default dict) | nindent 12 }}
          {{- if $svc.livenessProbe }}
          livenessProbe:
            httpGet:
              path: {{ $svc.livenessProbe.path }}
              port: {{ $svc.livenessProbe.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- else }}
          # Default fallback probe
          livenessProbe:
            tcpSocket:
              port: {{ $svc.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- end }}
          {{- if $svc.readinessProbe }}
          readinessProbe:
            httpGet:
              path: {{ $svc.readinessProbe.path }}
              port: {{ $svc.readinessProbe.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- else }}
          readinessProbe:
            tcpSocket:
              port: {{ $svc.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
{{- end }}
{{- end }}
