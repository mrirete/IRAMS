name: Security Scan

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight

jobs:
  sast-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit (Python SAST)
        run: bandit -r src/ -f json -o bandit-report.json --severity-level medium --exit-zero || true
      - name: Display Bandit Results
        if: always()
        run: |
          if [ -f bandit-report.json ]; then
            python -m json.tool bandit-report.json | head -100
          fi

  # Storage posture. Unlike the SAST jobs below this one BLOCKS: a public
  # bucket is a live unauthenticated exposure, not a maybe. Skipped rather
  # than failed when the token is absent (e.g. on a fork PR).
  storage-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit bucket visibility and tenant scoping
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN/PROJECT_REF not set — storage audit skipped."
            exit 0
          fi
          node scripts/provision/audit-storage.mjs --strict

  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
