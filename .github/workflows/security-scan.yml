# Security scanning (finding F-005 hardened this file — history in
# docs/compliance/isms/internal-audit-and-review.md):
#   · gates BLOCK now: CRITICAL vulns, leaked secrets, storage posture.
#     HIGH stays report-only until the backlog is triaged (a gate that is
#     red on day one gets ignored, which is worse than advisory).
#   · third-party and setup actions pinned by commit SHA (supply-chain,
#     risk R-09) — the comment keeps the human-readable version.
#   · runs on PRs too, so findings block before merge, not after.
name: Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight

jobs:
  # Leaked credentials — full history scan. BLOCKING.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dependency vulnerabilities, JS/TS side. BLOCKING at critical.
  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
      - name: npm audit (prod deps, blocking at critical)
        run: npm audit --omit=dev --audit-level=critical
      - name: npm audit report (high, advisory)
        if: always()
        run: npm audit --omit=dev --audit-level=high || true

  # Python SAST — covers the FastAPI/agent layers only (src/*.py, layer*);
  # the TS frontend is typechecked + tested in build.yml and dependency-
  # scanned above. BLOCKING at high severity.
  sast-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit (blocking at high severity)
        run: bandit -r src/main.py src/layer1-data-fabric src/layer2-modules src/layer3-agents src/layer4-integration src/shared --severity-level high

  # Storage posture. BLOCKING: a public bucket is a live unauthenticated
  # exposure, not a maybe. Skipped rather than failed when the token is
  # absent (e.g. on a fork PR).
  storage-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
      - name: Audit bucket visibility and tenant scoping
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN/PROJECT_REF not set — storage audit skipped."
            exit 0
          fi
          node scripts/provision/audit-storage.mjs --strict

  # Filesystem/lockfile CVE scan. BLOCKING at CRITICAL; HIGH reported below.
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Trivy — CRITICAL (blocking)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
      - name: Trivy — HIGH (advisory)
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH'
