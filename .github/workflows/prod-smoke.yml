# Post-deploy production smoke — drives the LIVE app in headless Chromium
# after every push to main (Vercel auto-deploys main; this waits for the
# deploy, then cold-loads the core routes with a real session).
#
# Born from the 2026-07 stuck-spinner incident: every logged-in page hung
# while build/types/unit tests stayed green. Only a browser can catch that.
#
# Requires repository secrets for the authenticated sweep (otherwise only the
# public /login check runs):
#   SMOKE_EMAIL / SMOKE_PASSWORD — a dedicated low-privilege smoke login.
#   SMOKE_LOGINS_JSON (optional)  — sweep once per role instead of once per app:
#       [{"label":"RELIABILITY_ENG","email":"…","password":"…"},
#        {"label":"TECHNICIAN","email":"…","password":"…"}]
#     Overrides the single login. Role gating is a launch risk in its own right —
#     a route that renders for an admin can still be blank for a technician.
name: Production Smoke

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: prod-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Vercel publish can take 15–20 min under load; the smoke waits up to
    # SMOKE_DEPLOY_WAIT_MIN (18) for the SHA. The sweep itself is ~4 min per
    # login (26 desktop routes + 13 at phone width), so headroom scales with
    # how many logins SMOKE_LOGINS_JSON carries.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        working-directory: src/frontend
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run smoke against production
        working-directory: src/frontend
        env:
          BASE: https://irams.vercel.app
          EXPECT_SHA: ${{ github.sha }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_LOGINS_JSON: ${{ secrets.SMOKE_LOGINS_JSON }}
        run: node tests/e2e/smoke.mjs
