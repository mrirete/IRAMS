name: Build and Test ERS

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      # Launch review B7: this step used to end in `|| true`, so a failing
      # suite still turned the job green. Known-red cases stay deselected
      # explicitly; everything else must pass.
      - name: Run Pytest
        env:
          PYTHONPATH: src
        run: |
          pytest tests/ --cov=src --cov-report=xml \
            --asyncio-mode=auto \
            --ignore=tests/integration \
            -p no:warnings \
            --deselect=tests/test_comply_audit.py::TestCrossAuditPatterns::test_systemic_pattern_detected \
            --deselect=tests/test_inventory_engines.py::TestInventoryEngine::test_eoq_standard \
            --deselect=tests/test_inventory_engines.py::TestInventoryEngine::test_abc_classification \
            --deselect=tests/test_knowledge_graph.py::TestKnowledgeDependency::test_exclusive_assets_detected \
            --deselect=tests/test_knowledge_graph.py::TestCausationChain::test_shared_cause_siblings \
            --deselect=tests/test_knowledge_graph.py::TestSAMPContributors::test_at_risk_assets_flagged

  frontend-typecheck:
    # The Vercel build now runs the same command (build:vercel), so a type
    # error can no longer reach production. This job makes it visible on the PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd src/frontend
          npm install
      - name: Typecheck (tsc, app project)
        run: |
          cd src/frontend
          npm run typecheck

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd src/frontend
          npm install
      - name: Run TS Tests
        run: |
          cd src/frontend
          npm run test
      - name: Silent-success scan
        # Detects "toasted success but wrote nothing" patterns (real incidents
        # in its header). Was manual-only; now blocks the PR.
        run: |
          cd src/frontend
          npm run scan:silent

  tenant-guard:
    # Static row-security completeness (migration 0264) against the project
    # the secrets point at. Skipped, not failed, when the secrets are absent
    # (fork PRs) — same posture as security-scan's storage-audit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tenant policy completeness
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN/PROJECT_REF not set — tenant guard skipped."
            exit 0
          fi
          cd src/frontend
          npm run test:tenant-guard

  docker-build:
    needs: [python-tests, frontend-typecheck, frontend-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Frontend is deployed via Vercel — not containerized
        service: [api-gateway, data-fabric, predict, analyze, comply, vision, work, agents]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build \
            -f infrastructure/docker/Dockerfile.python \
            -t ers-${{ matrix.service }}:${{ github.sha }} .
          # In reality, we'd push to ECR/ACR/GCR here if on main
